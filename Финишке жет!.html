<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Финишке жет!</title>
<style>
:root{--bg:#f6f4ee;--fg:#14213d;--card:#ffffff;--ac:#e08a00;--ok:#1b8a5a;--bad:#c0392b;--line:#cfc9b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14213d;--fg:#f6f4ee;--card:#1f3159;--ac:#fca311;--ok:#4cc38a;--bad:#ff7b6b;--line:#3b4d7a}}
:root[data-theme="dark"]{--bg:#14213d;--fg:#f6f4ee;--card:#1f3159;--ac:#fca311;--ok:#4cc38a;--bad:#ff7b6b;--line:#3b4d7a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;min-height:100vh}
.w{max-width:880px;margin:0 auto;padding:20px}
h1{font-size:30px;margin:0 0 4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.st{display:flex;gap:10px;font-size:20px;font-weight:700}.st span{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 14px}
.track{position:relative;height:110px;margin:8px 0 18px;background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.road{position:absolute;left:32px;right:32px;top:78px;height:6px;background:var(--line);border-radius:3px}
.dot{position:absolute;top:72px;width:16px;height:16px;border-radius:50%;background:var(--line);transform:translateX(-50%)}
.dot.on{background:var(--ac)}
.flag{position:absolute;right:8px;top:14px;font-size:30px}
#wh{position:absolute;top:18px;left:0;width:64px;height:64px;transition:left 1s ease}
#wh svg{width:64px;height:64px;transition:transform 1s ease}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:22px}
#q{font-size:24px;line-height:1.35;margin:0 0 16px;font-weight:700}
#bn{display:inline-block;background:var(--ac);color:#14213d;border-radius:8px;padding:2px 10px;font-size:18px;margin-right:8px}
.o{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.o{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer}
.op{font-size:22px;padding:16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);text-align:left}
.op:hover:not(:disabled){border-color:var(--ac)}
.op.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.op.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.op:disabled{cursor:default}
#fb{font-size:22px;margin:16px 0 0;min-height:30px}
.nx{margin-top:12px;font-size:22px;font-weight:700;padding:12px 26px;border-radius:12px;border:0;background:var(--ac);color:#14213d}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{font-size:34px;font-weight:700;margin:0 0 10px}
#vz{margin-top:14px}#vz svg{width:100%;display:block;background:var(--bg);border:2px solid var(--line);border-radius:12px}
#vl{font-size:22px;font-weight:700;margin:10px 0 0}.rp{font-size:18px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);margin-top:8px}
</style></head><body><div class="w">
<div class="top"><h1>Финишке жет!</h1><div class="st"><span id="s1">Қадам: 0 / 10</span><span id="s2">Ұпай: 0</span></div></div>
<div class="track" id="tr"><div class="road"></div><div class="flag">🏁</div>
<div id="wh"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#e8ecf5" stroke="#14213d" stroke-width="4"/><line x1="32" y1="4" x2="32" y2="60" stroke="#3a86ff" stroke-width="4"/><line x1="4" y1="32" x2="60" y2="32" stroke="#14213d" stroke-width="3"/><circle cx="32" cy="58" r="5" fill="#fca311" stroke="#14213d" stroke-width="2"/></svg></div></div>

var AF=0,P=Math.PI,B={},$=function(i){return document.getElementById(i)},set=function(i,a,v){$(i).setAttribute(a,v)},txt=function(i,t){$(i).textContent=t},F=function(x,d){return x.toFixed(d==null?1:d).replace('.',',')};

function demo(v,el){cancelAnimationFrame(AF);var o=B[v.t](v);el.innerHTML='<svg viewBox="0 0 800 '+o.h+'">'+o.s+'</svg><p id="vl"></p><button class="rp">↻ Қайта көрсету</button>';

var i,step,score,lock,box=document.getElementById('box'),wh=document.getElementById('wh'),tr=document.getElementById('tr'),dots=[];

box.innerHTML='<p id="q">'+(q.s?'<span id="bn">★ ×2 қадам</span>':'')+(i+1)+'/'+Q.length+'. '+q.q+'</p><div class="o"></div><p id="fb"></p><div id="nz"></div>';
