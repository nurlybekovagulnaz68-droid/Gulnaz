<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гонка делимости</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe66d;--bg2:#ff9ecb;--bg3:#8ee3ff;--card:#fffdf7;--ink:#241b4b;--line:#cfc6f2;--a:#ff3d6e;--b:#1e7bff;--ok:#16a34a;--no:#e11d48;--cell:#f3efff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3b1d6e;--bg2:#6b1d5c;--bg3:#12396b;--card:#1d1840;--ink:#f6f2ff;--line:#4b4290;--cell:#2a2358}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;font-weight:600;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));background-attachment:fixed}
h1,h2,h3,.timer,.big{font-family:Unbounded,Nunito,system-ui,sans-serif}
.screen{max-width:1500px;margin:0 auto;padding:16px}
.hide{display:none!important}
.start{max-width:640px;margin:4vh auto;background:var(--card);border-radius:28px;padding:28px;box-shadow:0 14px 0 rgba(36,27,75,.25)}
.start h1{font-size:clamp(26px,6vw,42px);margin:0 0 6px;line-height:1.1}
.start p{margin:0 0 18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
label{font-weight:800;font-size:14px;display:block;margin-bottom:4px}
.start input[type=text]{width:100%;font:inherit;font-weight:800;font-size:18px;padding:12px;border-radius:14px;border:3px solid;background:var(--cell);color:var(--ink)}
#n0{border-color:var(--a)}#n1{border-color:var(--b)}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.modes label{flex:1;min-width:130px;margin:0;cursor:pointer}
.modes input{position:absolute;opacity:0}
.modes span{display:block;text-align:center;padding:12px;border-radius:14px;background:var(--cell);border:3px solid transparent}
.modes input:checked+span{border-color:var(--ink);background:#ffd23f;color:#241b4b}
.modes input:focus-visible+span{outline:3px solid var(--b)}
.go{width:100%;font:inherit;font-family:Unbounded,sans-serif;font-weight:800;font-size:22px;padding:16px;border:0;border-radius:18px;color:#fff;background:linear-gradient(90deg,var(--a),#ff9a3d);box-shadow:0 6px 0 rgba(36,27,75,.35);cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(36,27,75,.35)}
.arena{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:1000px){.arena{grid-template-columns:1fr 1fr}}
.team{position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:var(--card);border-radius:24px;padding:14px;border:6px solid var(--tc);box-shadow:0 8px 0 rgba(36,27,75,.25);min-width:0}
.t0{--tc:var(--a)}.t1{--tc:var(--b)}
.team header{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--tc);color:#fff;border-radius:14px;padding:10px 14px}
.team h2{margin:0;font-size:clamp(16px,2.4vw,24px);overflow-wrap:anywhere}
.timer{font-size:clamp(18px,2.6vw,28px);font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:16px;border-radius:9px;background:var(--cell);margin:10px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--tc);transition:width .25s}
.pct{font-size:13px;text-align:right;margin-bottom:6px}
.team h3{font-size:14px;margin:12px 0 8px;line-height:1.3}
.wrap{overflow-x:auto;border-radius:12px;border:2px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:480px}
th{font-size:12px;padding:6px 4px;background:var(--tc);color:#fff;border:1px solid rgba(255,255,255,.35);line-height:1.15}
td{border:1px solid var(--line);padding:3px;text-align:center;height:44px}
td.num{font-weight:800;font-size:15px;white-space:nowrap;background:var(--cell)}
tr.ex td{background:rgba(255,210,63,.35)}
td input{width:100%;min-width:42px;height:36px;border:2px solid var(--line);border-radius:8px;text-align:center;font:inherit;font-weight:800;font-size:16px;background:var(--card);color:var(--ink)}
td input:focus{outline:3px solid var(--tc);border-color:var(--tc)}
td input[readonly]{background:transparent;border-color:transparent}
.tg{width:100%;min-width:42px;height:36px;border:2px solid var(--line);border-radius:8px;background:var(--card);font-size:22px;font-weight:800;cursor:pointer;color:var(--ink)}
.tg[data-v="1"]{color:var(--ok)}.tg[data-v="1"]::before{content:"✓"}
.tg[data-v="2"]{color:var(--no)}.tg[data-v="2"]::before{content:"✗"}
.tg:disabled,.nv:disabled{border-color:transparent;background:transparent;cursor:default;color:var(--ink)}
.tg:focus-visible,.nv:focus-visible{outline:3px solid var(--tc)}
.nv{width:100%;min-width:42px;height:36px;border:2px dashed var(--tc);border-radius:8px;background:var(--card);font:inherit;font-weight:800;font-size:17px;cursor:pointer;color:var(--ink)}
.nv:disabled{font-weight:800}
.pk{position:absolute;z-index:20;width:270px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px;background:var(--card);border:4px solid var(--tc);border-radius:16px;box-shadow:0 8px 0 rgba(36,27,75,.3)}
.pk.wide{width:360px;grid-template-columns:repeat(8,1fr)}
.pk.hide{display:none}
.opt{height:40px;border:0;border-radius:10px;background:var(--cell);color:var(--ink);font:inherit;font-weight:800;font-size:18px;cursor:pointer}
.opt:hover,.opt:focus-visible{background:var(--tc);color:#fff;outline:0}
.bad .nv,.bad .tg{border-color:var(--no)!important;background:rgba(225,29,72,.2)!important;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.done{display:block;width:100%;margin-top:14px;font-family:Unbounded,sans-serif;font-weight:800;font-size:18px;padding:14px;border:0;border-radius:16px;color:#fff;background:var(--tc);box-shadow:0 5px 0 rgba(36,27,75,.35);cursor:pointer}
.msg{min-height:24px;margin:8px 0 0;text-align:center;font-weight:800;color:var(--no)}
.locked .team{pointer-events:none}
.ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(36,27,75,.85);color:#fff;text-align:center;padding:20px}
.big{font-size:min(40vw,260px);font-weight:800;animation:pop .9s infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}30%{opacity:1}100%{transform:scale(1.1)}}
.win{background:var(--card);color:var(--ink);padding:28px;border-radius:28px;border:8px solid var(--tc);max-width:520px;box-shadow:0 12px 0 rgba(0,0,0,.3)}
.win h2{font-size:clamp(24px,6vw,38px);margin:6px 0}
.win .go{margin-top:16px}
.cf{position:fixed;top:-20px;width:10px;height:16px;z-index:60;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){.big,.cf,.bad input,.bad .tg{animation:none}}
</style>
</head>
<body>
<div class="screen" id="start">
  <div class="start">
    <h1>Гонка делимости 🏁</h1>
    <p>Две команды заполняют таблицы одновременно. Выигрывает та, что первой заполнит всё без ошибок.</p>
    <div class="row">
      <div><label for="n0">Команда 1</label><input type="text" id="n0" value="Красные" maxlength="16"></div>
      <div><label for="n1">Команда 2</label><input type="text" id="n1" value="Синие" maxlength="16"></div>
    </div>
    <label>Что решаем</label>
    <div class="modes">
      <label><input type="radio" name="m" value="0"><span>Задание 1</span></label>
      <label><input type="radio" name="m" value="1"><span>Задание 2</span></label>
      <label><input type="radio" name="m" value="2" checked><span>Оба задания</span></label>
    </div>
    <button class="go" id="go">Старт!</button>
  </div>
</div>

<div class="screen hide" id="game"><div class="arena" id="arena"></div></div>
<div class="ov hide" id="ov"></div>

<script>
const ds=n=>String(n).split('').reduce((a,b)=>a+ +b,0);
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
const D=[
 {cols:['Делится на 2','Делится на 5','Делится на 10','Остаток при делении на 2','Остаток при делении на 5','Остаток при делении на 10'],
  ty:'bbbnnn',nums:[3808,45706,122549,86250,4005,13332,90001,973,1407,2815534],
  f:n=>[n%2==0,n%5==0,n%10==0,n%2,n%5,n%10]},
 {cols:['Сумма цифр','Делится на 3','Делится на 9','Остаток при делении на 3','Остаток при делении на 9'],
  ty:'nbbnn',nums:[23964,1803,2111401,47439,556,472000,2012021,3011,557111,33888],
  f:n=>[ds(n),n%3==0,n%9==0,n%3,n%9]}
];
let teams=[],tasks=[],running=false,t0=0,tick=null;
const $=id=>document.getElementById(id);
const tm=ms=>{const s=ms/1000;return Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0')};

function build(i,name){
  const el=document.createElement('section');el.className='team t'+i;
  let h=`<header><h2>${name.replace(/</g,'&lt;')}</h2><div class="timer">0:00.0</div></header><div class="bar"><i></i></div><div class="pct">0%</div>`;
  tasks.forEach(k=>{
    const T=D[k];
    h+=`<h3>Задание ${k+1}. Заполните таблицу по образцу.</h3><div class="wrap"><table><thead><tr><th>Натуральное число</th>${T.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
    T.nums.forEach((n,r)=>{
      const a=T.f(n),ex=r==0;
      h+=`<tr class="${ex?'ex':''}"><td class="num">${fmt(n)}</td>`;
      a.forEach((v,c)=>{
        const d=`data-k="${k}" data-r="${r}" data-c="${c}"`;
        h+='<td>'+(T.ty[c]=='b'
          ?`<button class="tg" ${d} data-v="${ex?(v?1:2):0}" ${ex?'disabled':''} aria-label="Да или нет"></button>`
          :`<button class="nv" ${d} data-v="${ex?v:''}" ${ex?'disabled':''} aria-label="Выбрать число">${ex?v:''}</button>`)+'</td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  });
  h+='<button class="done">Готово! ✅</button><p class="msg" aria-live="polite"></p><div class="pk hide"></div>';
  el.innerHTML=h;
  const t={el,name,i,total:0,filled:0};
  el.querySelectorAll('tr:not(.ex) [data-k]').forEach(()=>t.total++);
  const upd=()=>{
    t.filled=[...el.querySelectorAll('tr:not(.ex) [data-k]')].filter(x=>x.dataset.v!==(x.classList.contains('tg')?'0':'')).length;
    const p=Math.round(t.filled/t.total*100);
    el.querySelector('.bar i').style.width=p+'%';el.querySelector('.pct').textContent=p+'%';
  };
  const clr=x=>x.closest('td').classList.remove('bad');
  const pk=el.querySelector('.pk');let cur=null;
  const close=()=>{pk.classList.add('hide');cur=null};
  const act=e=>{
    if(!running)return;
    const b=e.target.closest('.tg');
    if(b&&!b.disabled){b.dataset.v=(+b.dataset.v+1)%3;clr(b);upd();close();return}
    const o=e.target.closest('.opt');
    if(o&&cur){cur.dataset.v=o.dataset.n;cur.textContent=o.dataset.n;clr(cur);upd();close();return}
    const n=e.target.closest('.nv');
    if(n&&!n.disabled){
      cur=n;const max=(n.dataset.k==='1'&&n.dataset.c==='0')?30:10;
      pk.className='pk'+(max>10?' wide':'');
      pk.innerHTML=Array.from({length:max+1},(_,i)=>`<button class="opt" data-n="${i}">${i}</button>`).join('');
      const er=el.getBoundingClientRect(),nr=n.getBoundingClientRect();
      let l=nr.left-er.left-el.clientLeft;l=Math.max(0,Math.min(l,el.clientWidth-pk.offsetWidth));
      pk.style.left=l+'px';pk.style.top=(nr.bottom-er.top-el.clientTop+4)+'px';
      return;
    }
    close();
  };
  el.addEventListener('pointerdown',act);
  el.addEventListener('click',e=>{if(e.detail===0)act(e)});
  const dn=el.querySelector('.done');
  dn.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')dn.click()});
  dn.onclick=()=>{
    if(!running)return;
    const msg=el.querySelector('.msg');
    if(t.filled<t.total){msg.textContent='Заполни все клетки: осталось '+(t.total-t.filled);return}
    let bad=0;
    el.querySelectorAll('tr:not(.ex) [data-k]').forEach(x=>{
      const {k,r,c}=x.dataset,v=D[k].f(D[k].nums[r])[c];
      const ok=x.classList.contains('tg')?(x.dataset.v==(v?1:2)):(x.dataset.v===String(v));
      if(!ok){bad++;x.closest('td').classList.add('bad')}
    });
    if(bad){msg.textContent='Ошибок: '+bad+'. Исправь красные клетки!';return}
    win(t);
  };
  return t;
}

function start(){
  const m=document.querySelector('input[name=m]:checked').value;
  tasks=m==='2'?[0,1]:[+m];
  const names=[$('n0').value.trim()||'Команда 1',$('n1').value.trim()||'Команда 2'];
  $('start').classList.add('hide');
  const ov=$('ov');ov.className='ov';
  let c=3;
  const step=()=>{
    if(c>0){ov.innerHTML=`<div class="big">${c}</div>`;c--;setTimeout(step,900)}
    else{
      ov.innerHTML='<div class="big" style="font-size:min(20vw,140px)">Go!</div>';
      teams=names.map((n,i)=>build(i,n));
      const ar=$('arena');ar.innerHTML='';teams.forEach(t=>ar.appendChild(t.el));
      $('game').classList.remove('hide');document.body.classList.remove('locked');
      running=true;t0=performance.now();
      tick=setInterval(()=>{teams.forEach(t=>t.el.querySelector('.timer').textContent=tm(performance.now()-t0))},100);
      setTimeout(()=>ov.classList.add('hide'),600);
    }
  };
  step();
}

function win(t){
  running=false;clearInterval(tick);
  const time=performance.now()-t0;
  teams.forEach(x=>x.el.querySelector('.timer').textContent=tm(time));
  document.body.classList.add('locked');
  const ov=$('ov');ov.className='ov';
  const col=t.i?'var(--b)':'var(--a)';
  ov.innerHTML=`<div class="win t${t.i}" style="--tc:${col}"><div style="font-size:64px">🏆</div><h2>Победа: ${t.name.replace(/</g,'&lt;')}!</h2><p>Все ответы верные. Время: <b>${tm(time)}</b></p><button class="go" id="again">Играть снова</button></div>`;
  $('again').onclick=()=>{ov.className='ov hide';$('game').classList.add('hide');$('start').classList.remove('hide');document.body.classList.remove('locked')};
  const cols=['#ff3d6e','#ffd23f','#1e7bff','#16c784','#ff9a3d','#a855f7'];
  for(let i=0;i<80;i++){
    const d=document.createElement('i');d.className='cf';
    d.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%6]};animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*.8}s`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),6000);
  }
}
$('go').onclick=start;
</script>
</body>
</html>
