<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рисунок: система управления школой</title>
<style>
:root{--bg:#f2f5f7;--surf:#fff;--ink:#17283d;--mut:#51606f;--acc:#0f6b64;--acc2:#a8651a;--tint:#e1efed;--tint2:#f6ebdc;--band:#e8edf1;--ef:#ffe3c2;--es:#e07b00;--eb:#fff0dc;--sf:#ffd1dc;--ss:#d6336c;--sb:#ffe8ef;--tf:#cfe6ff;--ts:#1c7ed6;--tb:#e6f2ff;--of:#cdf5d3;--os:#2f9e44;--ob:#e9faec;--pf:#fff0a8;--ps:#e08700;--pb:#fff9d6;--cf:#e2d8ff;--cs:#7048e8;--cb:#f1ecff;--rf:#c2f3f8;--rs:#0c8599;--rb:#e3fafc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a24;--surf:#182533;--ink:#e6edf3;--mut:#9fb0bf;--acc:#4fc4b9;--acc2:#e0a25a;--tint:#14383a;--tint2:#3a2d19;--band:#16222e;--ef:#4a2f10;--es:#ffa94d;--eb:#2a1d10;--sf:#4d1d2e;--ss:#f783ac;--sb:#2b1620;--tf:#17375c;--ts:#74c0fc;--tb:#14212f;--of:#1b4025;--os:#69db7c;--ob:#14241a;--pf:#4a3b0f;--ps:#ffd43b;--pb:#292311;--cf:#35285c;--cs:#b197fc;--cb:#201a33;--rf:#0f3f47;--rs:#66d9e8;--rb:#112a2f;}}
:root[data-theme="dark"]{--bg:#101a24;--surf:#182533;--ink:#e6edf3;--mut:#9fb0bf;--acc:#4fc4b9;--acc2:#e0a25a;--tint:#14383a;--tint2:#3a2d19;--band:#16222e;--ef:#4a2f10;--es:#ffa94d;--eb:#2a1d10;--sf:#4d1d2e;--ss:#f783ac;--sb:#2b1620;--tf:#17375c;--ts:#74c0fc;--tb:#14212f;--of:#1b4025;--os:#69db7c;--ob:#14241a;--pf:#4a3b0f;--ps:#ffd43b;--pb:#292311;--cf:#35285c;--cs:#b197fc;--cb:#201a33;--rf:#0f3f47;--rs:#66d9e8;--rb:#112a2f;}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PT Sans",system-ui,sans-serif}
h1{font:700 clamp(20px,3vw,30px)/1.2 Georgia,serif;margin:0;padding:20px 20px 12px;text-align:center}
.wrap{overflow-x:auto;padding:0 12px 24px}
svg{display:block;width:100%;min-width:1000px;max-width:1500px;margin:0 auto;height:auto}
svg text{fill:var(--ink);font-size:14px}
.s{font-size:12.5px;fill:var(--mut)}
.b{font-weight:700}
.bd{fill:var(--band)}
.lb{font-size:13px;font-weight:700;fill:var(--mut)}
.n{fill:var(--surf);stroke:var(--acc);stroke-width:1.6}
.t{fill:var(--tint)}.a{fill:var(--tint2);stroke:var(--acc2)}
.l{stroke:var(--mut);stroke-width:1.6;fill:none}
.d{stroke:var(--acc2);stroke-dasharray:6 4}
rect.e{fill:var(--ef);stroke:var(--es);stroke-width:2.2}.bde{fill:var(--eb)}.lbe{fill:var(--es)}rect.s{fill:var(--sf);stroke:var(--ss);stroke-width:2.2}.bds{fill:var(--sb)}.lbs{fill:var(--ss)}rect.t{fill:var(--tf);stroke:var(--ts);stroke-width:2.2}.bdt{fill:var(--tb)}.lbt{fill:var(--ts)}rect.o{fill:var(--of);stroke:var(--os);stroke-width:2.2}.bdo{fill:var(--ob)}.lbo{fill:var(--os)}rect.p{fill:var(--pf);stroke:var(--ps);stroke-width:2.2}.bdp{fill:var(--pb)}.lbp{fill:var(--ps)}rect.c{fill:var(--cf);stroke:var(--cs);stroke-width:2.2}.bdc{fill:var(--cb)}.lbc{fill:var(--cs)}rect.r{fill:var(--rf);stroke:var(--rs);stroke-width:2.2}.bdr{fill:var(--rb)}.lbr{fill:var(--rs)}h1{background:linear-gradient(90deg,#d6336c,#7048e8,#1c7ed6,#2f9e44);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:clamp(24px,4vw,38px)!important}.l{stroke-width:2!important}.lbx{fill:var(--mut)}</style></head><body>
<h1>Система управления общеобразовательной школой</h1>
<div class="wrap"><svg viewBox="0 0 1200 780" role="img" aria-label="Обобщённая схема системы управления школой">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--mut)"/></marker></defs>
<g><rect class="bde" x="5" y="40" width="1190" height="82" rx="6"/><rect class="bds" x="5" y="134" width="1190" height="100" rx="6"/><rect class="bdt" x="5" y="246" width="1190" height="112" rx="6"/><rect class="bdo" x="5" y="370" width="1190" height="92" rx="6"/><rect class="bdp" x="5" y="474" width="1190" height="90" rx="6"/><rect class="bdc" x="5" y="576" width="1190" height="104" rx="6"/><rect class="bdr" x="5" y="692" width="1190" height="76" rx="6"/></g>
<g class="lb"><text x="16" y="86" class="lbe">Внешняя среда</text><text x="16" y="182" class="lbs">Стратегический</text><text x="16" y="198" class="lbx">уровень</text><text x="16" y="298" class="lbt">Тактический</text><text x="16" y="314" class="lbx">уровень</text><text x="16" y="414" class="lbo">Оперативный</text><text x="16" y="430" class="lbx">уровень</text><text x="16" y="516" class="lbp">Образовательный</text><text x="16" y="532" class="lbx">процесс</text><text x="16" y="624" class="lbc">Управленческий</text><text x="16" y="640" class="lbx">цикл</text><text x="16" y="734" class="lbr">Результат</text></g>
<!-- external -->
<g text-anchor="middle">
<rect class="n e" x="150" y="50" width="300" height="56" rx="4"/><text x="300" y="74" class="b">Учредитель</text><text x="300" y="94" class="s">отдел образования, финансирование</text>
<rect class="n e" x="480" y="50" width="300" height="56" rx="4"/><text x="630" y="74" class="b">Нормативная база</text><text x="630" y="94" class="s">закон об образовании, ГОС, устав</text>
<rect class="n e" x="810" y="50" width="300" height="56" rx="4"/><text x="960" y="74" class="b">Общество и семья</text><text x="960" y="94" class="s">социальный заказ, запрос родителей</text>
<path class="l" marker-end="url(#ar)" d="M630 106V150"/><path class="l" marker-end="url(#ar)" d="M300 106V126H570V150"/><path class="l" marker-end="url(#ar)" d="M960 106V126H690V150"/>
<!-- strategic -->
<rect class="n s" x="530" y="150" width="200" height="70" rx="4"/><text x="630" y="178" class="b">Директор</text><text x="630" y="198" class="s">цели, программа развития, кадры</text>
<rect class="n s" x="150" y="148" width="220" height="36" rx="4"/><text x="260" y="171">Педагогический совет</text>
<rect class="n s" x="150" y="192" width="220" height="36" rx="4"/><text x="260" y="215">Попечительский совет</text>
<rect class="n s" x="890" y="148" width="220" height="36" rx="4"/><text x="1000" y="171">Родительский комитет</text>
<rect class="n s" x="890" y="192" width="220" height="36" rx="4"/><text x="1000" y="215">Ученический совет</text>
<path class="l d" d="M530 185H450M450 166V210M450 166H370M450 210H370M730 185H810M810 166V210M810 166H890M810 210H890"/>
<!-- tactical -->
<path class="l" d="M630 220V240M262 240H997M262 240V262M507 240V262M752 240V262M997 240V262" marker-end="url(#ar)"/>
<rect class="n t" x="150" y="262" width="225" height="86" rx="4"/><text x="262" y="284" class="b">Зам. по учебной работе</text><text x="262" y="306" class="s">учебный план, расписание,</text><text x="262" y="322" class="s">контроль качества знаний</text>
<rect class="n t" x="395" y="262" width="225" height="86" rx="4"/><text x="507" y="284" class="b">Зам. по воспитанию</text><text x="507" y="306" class="s">воспитательная работа,</text><text x="507" y="322" class="s">кружки, связь с семьёй</text>
<rect class="n t" x="640" y="262" width="225" height="86" rx="4"/><text x="752" y="284" class="b">Зам. по хозяйству</text><text x="752" y="306" class="s">здание, оборудование,</text><text x="752" y="322" class="s">безопасность, закупки</text>
<rect class="n t" x="885" y="262" width="225" height="86" rx="4"/><text x="997" y="284" class="b">Служба поддержки</text><text x="997" y="306" class="s">психолог, соцпедагог,</text><text x="997" y="322" class="s">библиотекарь</text>
<!-- operational -->
<path class="l" marker-end="url(#ar)" d="M262 348V385M507 348V385M752 348V385M997 348V385"/>
<rect class="n o" x="150" y="385" width="225" height="70" rx="4"/><text x="262" y="415" class="b">Методические</text><text x="262" y="435">объединения</text>
<rect class="n o" x="395" y="385" width="225" height="70" rx="4"/><text x="507" y="415" class="b">Классные</text><text x="507" y="435">руководители</text>
<rect class="n o" x="640" y="385" width="225" height="70" rx="4"/><text x="752" y="415" class="b">Технический</text><text x="752" y="435">персонал</text>
<rect class="n o" x="885" y="385" width="225" height="70" rx="4"/><text x="997" y="415" class="b">Дополнительное</text><text x="997" y="435">образование</text>
<!-- process -->
<path class="l" d="M262 455V470M507 455V470M752 455V470M997 455V470M262 470H997"/><path class="l" marker-end="url(#ar)" d="M630 470V490"/>
<rect class="n p" x="150" y="490" width="300" height="60" rx="4"/><text x="300" y="526" class="b">Учителя-предметники</text>
<rect class="n p" x="480" y="490" width="300" height="60" rx="4"/><text x="630" y="526" class="b">Обучающиеся</text>
<rect class="n p" x="810" y="490" width="300" height="60" rx="4"/><text x="960" y="526" class="b">Родители</text>
<path class="l" marker-end="url(#ar)" d="M450 520H478M780 520H808"/>
<!-- cycle -->
<rect class="n c" x="155" y="598" width="170" height="68" rx="4"/><text x="240" y="626" class="b">Анализ</text><text x="240" y="646" class="s">ситуации</text>
<rect class="n c" x="350" y="598" width="170" height="68" rx="4"/><text x="435" y="626" class="b">Планирование</text><text x="435" y="646" class="s">цели, программа</text>
<rect class="n c" x="545" y="598" width="170" height="68" rx="4"/><text x="630" y="626" class="b">Организация</text><text x="630" y="646" class="s">приказы, мотивация</text>
<rect class="n c" x="740" y="598" width="170" height="68" rx="4"/><text x="825" y="626" class="b">Контроль</text><text x="825" y="646" class="s">мониторинг</text>
<rect class="n c" x="935" y="598" width="170" height="68" rx="4"/><text x="1020" y="626" class="b">Коррекция</text><text x="1020" y="646" class="s">выводы, решения</text>
<path class="l" marker-end="url(#ar)" d="M325 632H348M520 632H543M715 632H738M910 632H933"/>
<path class="l d" marker-end="url(#ar)" d="M1020 598V582H240V596"/>
<!-- result -->
<path class="l" marker-end="url(#ar)" d="M630 666V706"/>
<rect class="n r" x="350" y="706" width="560" height="50" rx="4"/><text x="630" y="728" class="b">Выпускник, качество образования</text><text x="630" y="746" class="s">удовлетворённость учеников и родителей</text>
<!-- feedback -->
<path class="l d" marker-end="url(#ar)" d="M910 731H1150V78H1112"/>
<text x="1168" y="410" transform="rotate(90 1168 410)" text-anchor="middle" class="s">обратная связь: результат влияет на запрос общества</text>
</g>
</svg></div>
<p style="text-align:center;font-size:13px;color:var(--mut);margin:0 12px 24px">Сплошные стрелки — линейное подчинение и порядок действий. Пунктир — коллегиальное участие и обратная связь.</p>
</body></html>
